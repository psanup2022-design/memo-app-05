name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Pages 설정이 "Deploy from branch: gh-pages"일 때 실제로 갱신됨
      # (GitHub Actions 전용 소스로만 쓰는 경우 Settings → Pages에서 gh-pages로 바꾸거나 둘 중 하나만 사용)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
